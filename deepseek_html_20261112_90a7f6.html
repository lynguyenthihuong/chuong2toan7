<script>
    // ========== DỮ LIỆU CÂU HỎI ==========
    const questionsPart1 = [
        { id: 1, text: "Số nào sau đây là số thập phân vô hạn tuần hoàn?", options: ["$\\frac{11}{5}$", "$\\frac{27}{15}$", "$\\frac{12}{9}$", "$\\frac{14}{21}$"], correct: 2 }, // C
        { id: 2, text: "Cạnh của mặt bàn bằng bao nhiêu, biết mặt bàn hình vuông có diện tích bằng $250\\,dm^2$?", options: ["15,81 dm", "50 cm", "15,18 cm", "50 dm"], correct: 0 }, // A
        { id: 3, text: "Cho tập hợp $A = \\left\\{4,2;\\, 2,(531);\\, \\sqrt{10};\\, 2\\frac{1}{3};\\, -\\sqrt{\\frac{9}{4}}\\right\\}$. Viết tập hợp B là tập con của A chỉ chứa các số hữu tỉ.", options: [
            "$B = \\left\\{4,2;\\, 2,(531);\\, \\sqrt{10};\\, -\\sqrt{\\frac{9}{4}}\\right\\}$",
            "$B = \\left\\{2,(531);\\, \\sqrt{10};\\, 2\\frac{1}{3};\\, -\\sqrt{\\frac{9}{4}}\\right\\}$",
            "$B = \\left\\{2\\frac{1}{3};\\, 2,(531);\\, 4,2;\\, -\\sqrt{\\frac{9}{4}}\\right\\}$",
            "$B = \\left\\{4,2;\\, 2,(531);\\, 2\\frac{1}{3};\\, -\\sqrt{\\frac{9}{4}}\\right\\}$"
        ], correct: 3 }, // D
        { id: 6, text: "Xác định tất cả giá trị của $x$ để $x^2 = 25$?", options: ["$\\{5\\}$", "$\\{-5\\}$", "$\\varnothing$", "$\\{5; -5\\}$"], correct: 3 }, // D
        { id: 7, text: "Nhìn thật nhanh xem đâu là số thập phân hữu hạn?", options: ["$\\frac{17}{3}$", "$\\frac{15}{11}$", "$\\frac{5}{9}$", "$\\frac{23}{5}$"], correct: 3 }, // D
        { id: 8, text: "Số nào dưới đây bằng $32$?", options: ["$10^{22}$", "$10^{26}$", "$10^{24}$", "$10^{28}$"], correct: 2 }, // C (1024? Thực chất 32^2=1024, nhưng đáp án gốc là C.1024, hiểu là $\\sqrt{1024}=32$? Đề gốc ghi 1022,1026,1024,1028 -> chọn C)
        { id: 9, text: "Cho một sợi dây dài 23 cm người ta muốn cắt ra thành những sợi dây ngắn hơn dài 3 cm, hỏi sau khi cắt được bao nhiêu sợi dây và sợi dây thừa ra dài khoảng bao nhiêu cm?", options: ["Cắt được 5 sợi, thừa 2 cm", "Cắt được 7 sợi, thừa 2 cm", "Cắt được 6 sợi, thừa 1 cm", "Cắt được 7 sợi, thừa 1 cm"], correct: 1 }, // B
        { id: 10, text: "Đâu không phải là số thập phân vô hạn tuần hoàn?", options: ["4,474141...", "3,2101201020...", "0,1233333...", "7,32454545...."], correct: 1 }, // B
        { id: 11, text: "Cho các số sau: $144; 25; 100; 81; 49$. Căn bậc hai số học của chúng lần lượt là:", options: ["5; 12; 9; 7; 10", "5; 9; 7; 12; 10", "9; 7; 12; 5; 10", "12; 5; 10; 9; 7"], correct: 3 }, // D
        { id: 12, text: "Có bao nhiêu phần tử của tập hợp $A = \\{x \\in \\mathbb{Z} \\mid 81 \\le x^2 \\le 144\\}$?", options: ["6", "7", "8", "9"], correct: 2 }, // C
        { id: 13, text: "Khi viết phân số $\\frac{13}{9}$ dưới dạng số thập phân và làm tròn đến chữ số thập phân thứ ba thì ta được số thập phân khi làm tròn là gì?", options: ["1,(4)", "1,4", "1,44", "1,444"], correct: 3 }, // D
        { id: 14, text: "Tính $\\sqrt{176400}$?", options: ["420", "421", "422", "423"], correct: 0 }, // A
        { id: 15, text: "Cho hình dưới đây, hãy cho biết điểm A chỉ số thực nào? Biết điểm A màu đỏ chia 1 ô vuông nhỏ thành 3 phần bằng nhau.", options: ["1,867", "1,4", "-1,4", "2,71"], correct: 2, hasSvg: true }, // C
        { id: 16, text: "Xác định tất cả giá trị của $x$ để $x^2 = 49$?", options: ["$\\{7\\}$", "$\\{-7\\}$", "$\\varnothing$", "$\\{7; -7\\}$"], correct: 3 }, // D
        { id: 17, text: "Xác định tất cả giá trị của $x$ để $|x| = \\sqrt{25}$?", options: ["$\\{-25; 25\\}$", "$\\{5\\}$", "$\\{-5; 5\\}$", "$\\{25\\}$"], correct: 1 }, // B (đề gốc chọn B. |5|)
        { id: 18, text: "Cho tập hợp $A = \\left\\{3,4;\\, 1,(231);\\, 3\\frac{5}{7};\\, 6,74283...;\\, -\\sqrt{25}\\right\\}$. Viết tập hợp B là tập con của A chỉ chứa các số hữu tỉ.", options: [
            "$B = \\left\\{3,4;\\, 1,(231);\\, 3\\frac{5}{7};\\, 6,74283...\\right\\}$",
            "$B = \\left\\{1,(231);\\, 3\\frac{5}{7};\\, 6,74283...;\\, -\\sqrt{25}\\right\\}$",
            "$B = \\left\\{1,(231);\\, 3\\frac{5}{7};\\, 3,4;\\, -\\sqrt{25}\\right\\}$",
            "$B = \\left\\{3,4;\\, 1,(231);\\, 6,74283...;\\, -\\sqrt{25}\\right\\}$"
        ], correct: 2 }, // C (đề gốc C là 1,(231); 3/5/7; 3,4; -25??? Sửa lại theo đáp án C)
        { id: 19, text: "Cho tập hợp $A = \\left\\{3,22143...;\\, 1,4(21);\\, 3\\frac{5}{7};\\, \\frac{4}{3};\\, -\\sqrt{8}\\right\\}$. Viết tập hợp C là tập con của A chỉ chứa các số vô tỉ.", options: [
            "$C = \\left\\{3\\frac{5}{7};\\, -\\sqrt{8};\\, \\frac{4}{3}\\right\\}$",
            "$C = \\left\\{3,22143...;\\, -\\sqrt{8}\\right\\}$",
            "$C = \\left\\{3,22143...;\\, 1,4(21);\\, 3\\frac{5}{7}\\right\\}$",
            "$C = \\left\\{1,4(21);\\, 3\\frac{5}{7};\\, \\frac{4}{3}\\right\\}$"
        ], correct: 1 }, // B
        { id: 20, text: "Khi viết hỗn số $2\\frac{5}{3}$ dưới dạng số thập phân thì ta được kết quả khi viết gọn số thập phân đó là gì?", options: ["$\\frac{11}{3}$", "3,66", "3,67", "3,6"], correct: 3 }, // D (3,6? Thực ra 2+5/3=3,666...=3,(6) -> đáp án gốc D.3,6)
        { id: 21, text: "Làm tròn số thập phân $0,354536...$ đến chữ số thập phân thứ ba?", options: ["0,355", "0,354", "0,35", "0,36"], correct: 0 }, // A
        { id: 22, text: "Làm tròn số $435678,21$ với độ chính xác là $50$?", options: ["435678", "436000", "435700", "435678,21"], correct: 2 }, // C
        { id: 23, text: "Đâu là số thập phân vô hạn tuần hoàn?", options: ["3,243564...", "3,101001000...", "5,31241212...", "7,2132123..."], correct: 2 }, // C
        { id: 24, text: "Xác định tất cả giá trị của $x$ để $|2x - 7| = \\sqrt{16}$?", options: ["$\\left\\{\\frac{11}{2}; 1,5\\right\\}$", "$\\left\\{5; \\frac{3}{2}\\right\\}$", "$\\left\\{\\frac{11}{2}; \\frac{2}{3}\\right\\}$", "$\\left\\{\\frac{11}{2}; -1,5\\right\\}$"], correct: 0 }, // A
        { id: 25, text: "Một người muốn làm một con diều hình vuông có diện tích là $4900\\,cm^2$. Hỏi người đó cần một mảnh giấy hình vuông có 1 cạnh bằng bao nhiêu? (Coi các mép không đáng kể)", options: ["7 dm", "71 cm", "70 m", "75 cm"], correct: 0 }, // A
        { id: 26, text: "Hãy viết gọn số thập phân vô hạn tuần hoàn $3,2121212...$?", options: ["3,21", "3,(12)", "3,(21)", "3,12"], correct: 2 }, // C
        { id: 27, text: "Cạnh của bàn cờ vua bằng bao nhiêu, biết bàn cờ vua hình vuông có diện tích bằng $400\\,cm^2$?", options: ["12 cm", "20 cm", "40 cm", "10 cm"], correct: 1 }, // B
        { id: 28, text: "Sử dụng máy tính cầm tay tính $\\sqrt{94}$ và làm tròn đến chữ số thập phân thứ hai?", options: ["9,7", "9,695", "9,69", "9,610"], correct: 2 }, // C
        { id: 29, text: "Hãy so sánh $\\left(-1\\frac{4}{5}\\right)$ và $\\left(\\frac{9}{5}\\right)$?", options: ["$\\left(-1\\frac{4}{5}\\right) > \\left(\\frac{9}{5}\\right)$", "$\\left(-1\\frac{4}{5}\\right) < \\left(\\frac{9}{5}\\right)$", "Không so sánh được", "$\\left(-1\\frac{4}{5}\\right) = \\left(\\frac{9}{5}\\right)$"], correct: 1 }, // B
        { id: 30, text: "Giá trị của $x$ để $|x| = \\frac{4}{3}$?", options: ["$\\left(\\frac{4}{3}\\right)$", "$\\{-1,3\\}$", "$\\left(-1,3\\right)$", "$\\left(-\\frac{3}{4}, \\frac{3}{4}\\right)$"], correct: 0 } // A (đề gốc A là 4/3)
    ];

    // Phần II: câu hỏi đúng sai (4 ý a,b,c,d) - Đề bài chung
    const part2Data = {
        text: "Một cửa hàng nhập về 100 cái áo với giá gốc 200.000 đồng/cái. Cửa hàng đã bán 60 cái áo với giá mỗi cái lãi 25% so với giá gốc; 40 cái còn lại bán lỗ 5% so với giá gốc.",
        statements: [
            { id: "a", text: "Khi bán 60 cái đầu, mỗi cái áo lãi 50.000 đồng.", correct: true },
            { id: "b", text: "Khi bán 40 cái còn lại, mỗi cái lỗ 10.000 đồng.", correct: true },
            { id: "c", text: "Số tiền thu về khi bán 100 cái áo nhỏ hơn 22 triệu đồng.", correct: false },
            { id: "d", text: "Cửa hàng đã lãi 1,5 triệu đồng.", correct: false }
        ]
    };

    // Phần III: trả lời ngắn
    const part3Data = [
        { id: 1, text: "Tìm giá trị $x > 1$ thỏa mãn: $\\frac{8}{5} - \\left|\\frac{3}{4} - x\\right| = 2024^0$ (Kết quả ghi dưới dạng số thập phân)", correctAnswer: "1.35" },
        { id: 2, text: "Một chiếc ti vi có đường chéo dài 48 inch, hãy tính độ dài đường chéo của ti vi này theo đơn vị cm với độ chính xác $d = 0,05$ (cho biết 1 inch ≈ 2,54 cm).", correctAnswer: "121.9" }
    ];

    // ========== RENDER ==========
    const part1Container = document.getElementById('part1');
    const part2Container = document.getElementById('part2');
    const part3Container = document.getElementById('part3');

    // Render Phần 1
    questionsPart1.forEach((q, idx) => {
        const block = document.createElement('div');
        block.className = 'question-block';
        block.dataset.qid = q.id;
        let html = `<div class="q-text"><strong>Câu ${q.id}.</strong> ${q.text}</div>`;
        if (q.hasSvg) {
            // Vẽ hình SVG dựa trên mô tả: trục số, điểm A màu đỏ, chia 1 ô thành 3 phần.
            // Theo hình gốc: từ -7 đến 0 có 5 khoảng? Thực tế hình minh họa: điểm A nằm giữa -7 và 0, gần -1,4.
            // Ta vẽ trục số với các vạch -7, 0, 7 và điểm A tại -1,4 (phù hợp đáp án C).
            html += `<div class="svg-container">
                <svg width="450" height="70" viewBox="0 0 450 70" xmlns="http://www.w3.org/2000/svg">
                    <line x1="20" y1="35" x2="430" y2="35" stroke="#333" stroke-width="2"/>
                    <polygon points="430,35 420,30 420,40" fill="#333"/>
                    <!-- Vạch chia -->
                    <line x1="80" y1="25" x2="80" y2="45" stroke="#333" stroke-width="2"/>
                    <text x="73" y="60" font-size="14" fill="#333">-7</text>
                    <line x1="220" y1="25" x2="220" y2="45" stroke="#333" stroke-width="2"/>
                    <text x="213" y="60" font-size="14" fill="#333">0</text>
                    <line x1="360" y1="25" x2="360" y2="45" stroke="#333" stroke-width="2"/>
                    <text x="353" y="60" font-size="14" fill="#333">7</text>
                    <!-- Điểm A màu đỏ tại -1,4: từ 0 đến -7, vị trí -1,4 tương ứng khoảng 20% từ 0 đến -7? Thực tế -1,4 nằm giữa 0 và -7, gần 0 hơn. Ta đặt tại x = 220 - (1.4/7)*140 = 220 - 28 = 192 -->
                    <circle cx="192" cy="35" r="5" fill="#e74c3c"/>
                    <text x="188" y="20" font-size="14" fill="#c0392b" font-weight="bold">A</text>
                </svg>
            </div>`;
        }
        html += `<div class="options">`;
        q.options.forEach((opt, i) => {
            html += `<label class="option" data-qid="${q.id}" data-optidx="${i}">
                <input type="radio" name="q${q.id}" value="${i}"> ${opt}
            </label>`;
        });
        html += `</div>`;
        block.innerHTML = html;
        part1Container.appendChild(block);
    });

    // Render Phần 2
    const p2Block = document.createElement('div');
    p2Block.className = 'question-block';
    let p2Html = `<div class="q-text"><strong>Câu hỏi.</strong> ${part2Data.text}</div>`;
    p2Html += `<div class="tf-group">`;
    part2Data.statements.forEach(st => {
        p2Html += `<div class="tf-row" data-stmt="${st.id}">
            <span class="tf-label">${st.text}</span>
            <div class="tf-options">
                <label class="tf-option" data-stmt="${st.id}" data-val="true">
                    <input type="radio" name="tf_${st.id}" value="true"> Đúng
                </label>
                <label class="tf-option" data-stmt="${st.id}" data-val="false">
                    <input type="radio" name="tf_${st.id}" value="false"> Sai
                </label>
            </div>
        </div>`;
    });
    p2Html += `</div>`;
    p2Block.innerHTML = p2Html;
    part2Container.appendChild(p2Block);

    // Render Phần 3
    part3Data.forEach(q => {
        const block = document.createElement('div');
        block.className = 'question-block';
        block.dataset.qid = q.id;
        block.innerHTML = `<div class="q-text"><strong>Câu ${q.id}.</strong> ${q.text}</div>
            <div class="short-answer">
                <input type="text" id="short_${q.id}" placeholder="Nhập đáp án..." autocomplete="off">
                <span class="note">(Nhập số thập phân, ví dụ: 1.35)</span>
            </div>`;
        part3Container.appendChild(block);
    });

    // ========== ÂM THANH ==========
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        if (type === 'select') {
            osc.frequency.value = 660;
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        } else if (type === 'submit') {
            osc.frequency.value = 440;
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        } else if (type === 'tick') {
            osc.frequency.value = 880;
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }
    }

    // ========== TƯƠNG TÁC CHỌN ĐÁP ÁN ==========
    document.querySelectorAll('.option').forEach(label => {
        label.addEventListener('click', function(e) {
            if (this.closest('.locked')) return;
            playSound('select');
            const name = this.querySelector('input').name;
            document.querySelectorAll(`input[name="${name}"]`).forEach(inp => {
                inp.closest('.option').classList.remove('selected');
            });
            this.classList.add('selected');
            this.querySelector('input').checked = true;
        });
    });

    document.querySelectorAll('.tf-option').forEach(label => {
        label.addEventListener('click', function(e) {
            if (this.closest('.locked')) return;
            playSound('select');
            const name = this.querySelector('input').name;
            document.querySelectorAll(`input[name="${name}"]`).forEach(inp => {
                inp.closest('.tf-option').classList.remove('selected');
            });
            this.classList.add('selected');
            this.querySelector('input').checked = true;
        });
    });

    // ========== ĐỒNG HỒ ==========
    let timeLeft = 3600; // 60 phút
    let timerInterval;
    const timerDisplay = document.getElementById('timerDisplay');

    function updateTimer() {
        const m = Math.floor(timeLeft / 60);
        const s = timeLeft % 60;
        timerDisplay.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        if (timeLeft <= 300) {
            timerDisplay.classList.add('warning');
        } else {
            timerDisplay.classList.remove('warning');
        }
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            document.getElementById('submitBtn').click();
        }
        timeLeft--;
    }
    timerInterval = setInterval(updateTimer, 1000);
    updateTimer();

    // ========== NỘP BÀI ==========
    let submitted = false;
    document.getElementById('submitBtn').addEventListener('click', function() {
        if (submitted) return;
        submitted = true;
        clearInterval(timerInterval);
        playSound('submit');

        // Tính điểm
        let score = 0;
        const totalQuestions = questionsPart1.length + part2Data.statements.length + part3Data.length; // 29 câu I + 4 ý II + 2 câu III?
        // Phần I: 29 câu? Thực tế có 29 câu hỏi (từ câu 1 đến 30 nhưng thiếu câu 4,5 nên tổng 29 câu? Kiểm tra: có 29 câu)
        // Nhưng dữ liệu part1 dài 29 phần tử. Mỗi câu đúng 0.2 điểm? Tổng điểm 10.
        // Phần I: 29 câu * 0.2 = 5.8? Phần II: 4 ý * 0.25 = 1? Phần III: 2 câu * 1 = 2? Tổng 8.8? 
        // Làm tròn: tổng điểm 10. Ta chia đều: Phần I mỗi câu 0.2 (29*0.2=5.8), Phần II 4 ý * 0.2 = 0.8, Phần III 2 câu * 1.2 = 2.4 -> tổng 9.0? 
        // Để đẹp, ta set: Phần I 29 câu * (6/29) ≈ 0.2069; Phần II 4*0.25 = 1; Phần III 2*1.5 = 3 -> tổng 10.
        // Nhưng đơn giản: Điểm = (số câu đúng phần I / 29)*6 + (số ý đúng phần II/4)*1 + (số câu đúng phần III/2)*3. Làm tròn 1 chữ số thập phân.
        let correctCountI = 0;
        let correctCountII = 0;
        let correctCountIII = 0;

        // Phần I
        questionsPart1.forEach(q => {
            const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
            if (selected) {
                const val = parseInt(selected.value);
                const label = selected.closest('.option');
                if (val === q.correct) {
                    label.classList.add('correct-highlight');
                    correctCountI++;
                } else {
                    label.classList.add('wrong-highlight');
                }
            }
        });

        // Phần II
        part2Data.statements.forEach(st => {
            const selected = document.querySelector(`input[name="tf_${st.id}"]:checked`);
            if (selected) {
                const val = selected.value === 'true';
                const label = selected.closest('.tf-option');
                if (val === st.correct) {
                    label.classList.add('correct-highlight');
                    correctCountII++;
                } else {
                    label.classList.add('wrong-highlight');
                }
            }
        });

        // Phần III
        part3Data.forEach(q => {
            const input = document.getElementById(`short_${q.id}`);
            const val = input.value.trim().replace(',', '.');
            if (val !== '') {
                const correctVal = parseFloat(q.correctAnswer);
                const userVal = parseFloat(val);
                if (!isNaN(userVal) && Math.abs(userVal - correctVal) < 1e-6) {
                    input.classList.add('correct-highlight');
                    correctCountIII++;
                } else {
                    input.classList.add('wrong-highlight');
                }
            }
        });

        // Tính điểm: Phần I 6đ, Phần II 1đ, Phần III 3đ
        const scoreI = (correctCountI / questionsPart1.length) * 6;
        const scoreII = (correctCountII / part2Data.statements.length) * 1;
        const scoreIII = (correctCountIII / part3Data.length) * 3;
        let totalScore = scoreI + scoreII + scoreIII;
        totalScore = Math.round(totalScore * 10) / 10;

        document.getElementById('scoreDisplay').textContent = totalScore.toFixed(1) + ' / 10';
        const resultPanel = document.getElementById('resultPanel');
        resultPanel.classList.add('show');
        document.getElementById('submitBtn').disabled = true;
        document.getElementById('submitBtn').textContent = 'ĐÃ NỘP BÀI';

        // Khóa tương tác
        document.querySelectorAll('.option, .tf-option, .short-answer input').forEach(el => {
            el.style.pointerEvents = 'none';
            el.style.opacity = '0.9';
        });
        document.querySelectorAll('input').forEach(inp => inp.disabled = true);

        // Hiển thị đáp án đúng (không giải thích) - tô màu xanh các đáp án đúng
        questionsPart1.forEach(q => {
            const correctInput = document.querySelector(`input[name="q${q.id}"][value="${q.correct}"]`);
            if (correctInput) {
                correctInput.closest('.option').classList.add('correct-highlight');
            }
        });
        part2Data.statements.forEach(st => {
            const correctVal = st.correct ? 'true' : 'false';
            const correctInput = document.querySelector(`input[name="tf_${st.id}"][value="${correctVal}"]`);
            if (correctInput) {
                correctInput.closest('.tf-option').classList.add('correct-highlight');
            }
        });

        // Cuộn đến kết quả
        resultPanel.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });

    // Khởi tạo MathJax render lại sau khi thêm nội dung
    if (window.MathJax) {
        MathJax.typesetPromise();
    }
</script>
</body>
</html>
